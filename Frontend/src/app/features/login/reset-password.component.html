<div class="login-page">
  <div class="login-card">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary-brand">ANADESA</h2>
      <p class="text-muted">Restablecer Contrasena</p>
    </div>
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Correo electronico</label>
        <input type="email" class="form-control" [(ngModel)]="correo" name="correo" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Codigo de verificacion</label>
        <input type="text" class="form-control" [(ngModel)]="codigo" name="codigo" required placeholder="Ingrese el codigo de 6 digitos" maxlength="6" inputmode="numeric" pattern="[0-9]*">
      </div>
      <div class="mb-3">
        <label class="form-label">Nueva contrasena</label>
        <input type="password" class="form-control" [(ngModel)]="nuevaContrasena" name="nuevaContrasena" required minlength="6">
      </div>
      <div *ngIf="message" class="alert" [class.alert-success]="!errorMsg" [class.alert-danger]="errorMsg">{{ message }}</div>
      <button type="submit" class="btn btn-primary-brand w-100 mb-3" [disabled]="loading">
        {{ loading ? 'Procesando...' : 'Restablecer contrasena' }}
      </button>
    </form>
    <div class="text-center">
      <a [routerLink]="['/forgot-password']" [queryParams]="{ correo: correo }" class="text-decoration-none me-3">Reenviar codigo</a>
      <a routerLink="/login" class="text-decoration-none">Volver al inicio de sesion</a>
    </div>
  </div>
</div>
