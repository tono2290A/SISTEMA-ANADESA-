<div class="login-page">
  <div class="login-card">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary-brand">ANADESA</h2>
      <p class="text-muted">Recuperacion de Contrasena</p>
    </div>
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Correo electronico</label>
        <input type="email" class="form-control" [(ngModel)]="correo" name="correo" required placeholder="Ingrese su correo registrado">
      </div>
      <div *ngIf="message" class="alert" [class.alert-success]="!error" [class.alert-danger]="error">{{ message }}</div>
      <div *ngIf="message && !error" class="d-grid mb-3">
        <button type="button" class="btn btn-success" (click)="irARestablecer()">
          Ya tengo el codigo — restablecer contrasena
        </button>
      </div>
      <button type="submit" class="btn btn-primary-brand w-100 mb-3" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Enviar codigo de recuperacion' }}
      </button>
    </form>
    <div class="text-center">
      <a routerLink="/login" class="text-decoration-none">Volver al inicio de sesion</a>
    </div>
  </div>
</div>
