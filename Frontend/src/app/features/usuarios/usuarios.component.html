<app-layout>
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0"><i class="fas fa-user-cog me-2"></i>Gestion de Usuarios</h5>
      <button class="btn btn-primary-brand" (click)="abrirFormulario()">
        <i class="fas fa-plus me-1"></i>Nuevo Usuario
      </button>
    </div>
    <div class="card-body">
      <div class="row mb-3">
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Buscar por nombre, usuario o correo..." [(ngModel)]="filtro" (input)="filtrar()">
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>Usuario</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let u of usuariosFiltrados">
              <td>{{ u.primer_nombre }} {{ u.primer_apellido }}</td>
              <td>{{ u.usuario }}</td>
              <td>{{ u.correo }}</td>
              <td><span class="badge bg-primary">{{ u.tipo_usuario_nombre }}</span></td>
              <td>
                <span class="badge" [class.bg-success]="u.estado" [class.bg-danger]="!u.estado">
                  {{ u.estado ? 'Activo' : 'Inactivo' }}
                </span>
              </td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-1" (click)="editar(u)"><i class="fas fa-edit"></i></button>
                <button class="btn btn-sm btn-outline-danger" (click)="eliminar(u)"><i class="fas fa-trash"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Formulario -->
  <div class="modal d-block" *ngIf="mostrarFormulario" style="background: rgba(0,0,0,0.5)">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5>{{ editando ? 'Editar' : 'Nuevo' }} Usuario</h5>
          <button class="btn-close" (click)="cerrarFormulario()"></button>
        </div>
        <div class="modal-body">
          <form (ngSubmit)="guardar()">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Primer Nombre *</label>
                <input type="text" class="form-control" [(ngModel)]="form.primer_nombre" name="primer_nombre" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Segundo Nombre</label>
                <input type="text" class="form-control" [(ngModel)]="form.segundo_nombre" name="segundo_nombre">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Primer Apellido *</label>
                <input type="text" class="form-control" [(ngModel)]="form.primer_apellido" name="primer_apellido" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Segundo Apellido</label>
                <input type="text" class="form-control" [(ngModel)]="form.segundo_apellido" name="segundo_apellido">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Usuario *</label>
                <input type="text" class="form-control" [(ngModel)]="form.usuario" name="usuario" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">{{ editando ? 'Nueva Contrasena (dejar vacio para no cambiar)' : 'Contrasena *' }}</label>
                <input type="password" class="form-control" [(ngModel)]="form.contrasena" name="contrasena" [required]="!editando">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Correo</label>
                <input type="email" class="form-control" [(ngModel)]="form.correo" name="correo">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Telefono</label>
                <input type="text" class="form-control" [(ngModel)]="form.telefono" name="telefono">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Tipo de Usuario *</label>
                <select class="form-select" [(ngModel)]="form.id_tipo_usuario" name="id_tipo_usuario" required>
                  <option [value]="0">Seleccione...</option>
                  <option [value]="1">Administrador</option>
                  <option [value]="2">Coordinador</option>
                  <option [value]="3">Facilitador Educacion</option>
                  <option [value]="4">Facilitador Mujeres</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Estado *</label>
                <select class="form-select" [(ngModel)]="form.estado" name="estado" required>
                  <option [value]="true">Activo</option>
                  <option [value]="false">Inactivo</option>
                </select>
              </div>
              <div class="col-12 mb-3">
                <label class="form-label">Roles</label>
                <div *ngFor="let rol of roles" class="form-check">
                  <input class="form-check-input" type="checkbox" [checked]="form.roles?.includes(rol.id_rol)" (change)="toggleRol(rol.id_rol)" [id]="'rol-'+rol.id_rol">
                  <label class="form-check-label" [for]="'rol-'+rol.id_rol">{{ rol.nombre }}</label>
                </div>
              </div>
            </div>
            <div class="text-end">
              <button type="button" class="btn btn-secondary me-2" (click)="cerrarFormulario()">Cancelar</button>
              <button type="submit" class="btn btn-primary-brand">{{ editando ? 'Actualizar' : 'Crear' }}</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</app-layout>
